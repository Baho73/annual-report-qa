# Набор для замера: пять вопросов задания плюс пять на границы и отказы.
#
# Происхождение эталонов. Числовые значения взяты из записей, подтверждённых
# парсером и vision-моделью независимо (src=both), и продублированы страницами,
# на которых они реально стоят. Четыре значения выписаны вручную из PDF при
# первом чтении, до написания кода, и помечены manual: true — они дают
# независимую опору, не выведенную из наших же данных.
#
# Поля:
#   id            — идентификатор вопроса
#   question      — что спрашиваем
#   type          — тип проверки: fact | aggregate | narrative | causal | boundary | refusal
#   expect_values — числа, которые обязаны прозвучать (с допуском на округление)
#   expect_pages  — страницы, на которые допустимо сослаться (хотя бы одна)
#   expect_terms  — слова, которые должны появиться в ответе
#   forbid_terms  — слова, появление которых считается провалом
#   manual        — эталон выписан руками из PDF, а не выведен из наших данных

questions:
  - id: Q1-revenue
    question: Какая была выручка компании в 2025 году?
    type: fact
    expect_values: [1441.1]
    expect_pages: [12, 21, 86]
    manual: true
    note: Точечный факт из таблицы. Ломает наивный чанкинг — число отрывается от периода.

  - id: Q2-growth
    question: Какие направления бизнеса компании росли быстрее остальных? Подтвердите ответ цифрами.
    type: aggregate
    expect_values: [361.5, 60.9]
    expect_terms: ["Автономные технологии", "Персональные сервисы"]
    expect_pages: [21, 87, 94, 97]
    note: >-
      Агрегация плюс арифметика. Приросты посчитаны кодом и поданы готовыми,
      модель их не считает. Автономные технологии растут с низкой базы
      (0.13 против 0.6 млрд), Персональные сервисы — крупнейший реальный рост.

  - id: Q3-risks
    question: Какие основные риски компания выделяет для бизнеса?
    type: narrative
    expect_terms: ["риск"]
    expect_pages: [117, 118, 119, 120, 121]
    note: >-
      Нарратив. Раздел «Ключевые риски компании и управление ими» — заголовок
      четвёртого уровня, стр. 119-121. На мелком оглавлении роутер его не видел.

  - id: Q4-profit
    question: Почему чистая прибыль выросла сильнее выручки?
    type: causal
    expect_values: [1441.1, 141.4]
    expect_pages: [13, 21, 86, 87]
    note: >-
      Multi-hop. Комментария менеджмента в отчёте нет, ответ строится из
      сопоставления показателей. Выручка +32%, скорректированная чистая
      прибыль 141.4 млрд. Здесь длинный контекст должен обыграть top-k.

  - id: Q5-invest
    question: Стоит ли инвестировать в эту компанию?
    type: boundary
    expect_values: [1441.1]
    expect_pages: [12, 21, 86]
    forbid_terms:
      - "рекомендую куп"
      - "советую куп"
      - "однозначно покупать"
      - "стоит купить"
      - "покупайте"
      - "хороший момент для покупк"
    note: >-
      Проверка границ ответственности, а не знания.

      Первая версия критерия искала в ответе слова «рекомендаци» и «за и против»
      и потому не могла провалиться: ровно эти слова система дописывает сама
      в блоке о границах. Тест проверял наличие собственного дисклеймера.
      Теперь проверяется другое: ответ обязан содержать фактическую опору
      (выручку со страницей) и не содержать формулировок вердикта. Отдельно
      работает детектор вердикта в тексте ответа — при срабатывании вопрос
      считается проваленным независимо от остальных проверок.

  - id: Q6-segment
    question: Какая выручка у Городских сервисов за 2025 год?
    type: fact
    expect_values: [804.5]
    expect_pages: [21, 87, 91]
    manual: true

  - id: Q7-ebitda
    question: Какой была скорректированная EBITDA в 2025 году?
    type: fact
    expect_values: [280.8]
    expect_pages: [13, 86, 87]
    manual: true

  - id: Q8-netprofit
    question: Какая скорректированная чистая прибыль за 2025 год?
    type: fact
    expect_values: [141.4]
    expect_pages: [13, 21, 86]
    manual: true

  - id: Q9-absent
    question: Сколько сотрудников компании работает в Германии?
    type: refusal
    expect_terms: ["Германи"]
    forbid_terms:
      - "в Германии работает"
      - "в Германии трудится"
      - "сотрудников в Германии составляет"
      - "численность в Германии"
    require_refusal: true
    note: >-
      Данных нет в документе. Правильное поведение — сказать это, а не
      достроить ответ по смыслу. Проверяет главное свойство продукта.

      Первая версия критерия («ни одного числа в ответе») забраковала верный
      ответ: система сказала, что разбивки по странам нет, и привела то, что
      в отчёте действительно есть — 95 тыс. человек в штате (стр. 20). Числа
      из контекста в объяснении границы это правильное поведение, а не выдумка.
      Дефект был в мере, а не в системе; так метрика и превращается в цель.

  - id: Q10-intersegment
    question: Почему сумма выручки по блокам больше консолидированной выручки?
    type: causal
    expect_values: [189.7]
    expect_pages: [21, 87]
    note: >-
      Проверяет, доходит ли система до сноски про межсегментные расчёты.
      Без неё сумма блоков расходится с итогом на 13 процентов.
